spring:
  application:
    name: jobpilot
  profiles:
    default: local
  # 读取根目录 .env（gitignored，含云端凭据与模型名）；文件不存在时不报错——
  # CI / 别人 clone 没有 .env 也能起（此时 provider-path 走默认 ollama，不需要任何 key）。
  config:
    import: optional:file:.env[.properties]
  ai:
    # provider 选择：**一处开关驱动三处**（provider-path + 下面两个），避免两个旋钮漂移。
    # ollama=本地（无需 key）；openai=云端（嵌入 SiliconFlow / 对话智谱）。
    model:
      chat: ${JOBPILOT_AGENT_PROVIDER_PATH:ollama}
      embedding: ${JOBPILOT_AGENT_PROVIDER_PATH:ollama}
      # 本项目只用 chat + embedding。其余模态在 OpenAI starter 里也会自动配置，
      # 且**不认** spring.ai.model.chat——无 key 时会因 AudioSpeechModel 等直接启动失败。
      # 显式设 none 让它们退避（Spring AI 的开关是 havingValue，非该值即不生效）。
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    ollama:
      # Spring AI 侧的模型配置与 jobpilot.rag.* 是「同一批模型的两种入口」：
      # 业务层读 RagProperties（端口与 Chroma 自检），而注入的 EmbeddingModel / ChatModel
      # 只认 spring.ai.ollama.*。两处必须指向同一个模型，否则会出现
      # 「配置写着 bge-m3、实际请求 mxbai-embed-large」这类难查的 404。
      #
      # 不配的后果（2026-10-03 真机验证实测）：
      #   - embedding 缺配 → 落到 Spring AI 默认的 mxbai-embed-large → 嵌入 404；
      #   - chat 缺配       → 落到 Spring AI 默认的 mistral → 对话 404。
      # 换模型会改变向量维度，必须同时走 ChromaStartupCheck 的维度校验（重建索引或阻断启动）。
      embedding:
        options:
          model: ${JOBPILOT_RAG_EMBEDDING_MODEL:bge-m3}
      chat:
        options:
          model: ${JOBPILOT_RAG_CHAT_MODEL:qwen2.5:3b}
    openai:
      # 云端 provider（OpenAI 兼容）：chat 与 embedding 各自独立的 base-url / api-key / model
      # （两者都继承 AbstractOpenAiProperties）。智谱 base 是 /api/paas/v4（**没有 /v1**），
      # Spring AI 会往后拼 /chat/completions、/embeddings。
      chat:
        base-url: ${JOBPILOT_OPENAI_CHAT_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        api-key: ${JOBPILOT_OPENAI_CHAT_API_KEY:}
        options:
          model: ${JOBPILOT_RAG_CHAT_MODEL:glm-4.7-flash}
      embedding:
        base-url: ${JOBPILOT_OPENAI_EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
        api-key: ${JOBPILOT_OPENAI_EMBEDDING_API_KEY:}
        options:
          model: ${JOBPILOT_RAG_EMBEDDING_MODEL:BAAI/bge-large-zh-v1.5}
  data:
    redis:
      # 撤销黑名单等命令的超时：Redis 不可达时快速失败走 fail-open（TokenBlacklistService），
      # 不吃 Lettuce 默认 60s 命令超时
      timeout: 2s

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jobpilot:
  agent:
    # I-2 ReAct runner 预算与超时（ARCHITECTURE §6）
    max-iterations: 5
    max-tool-calls-per-run: 8
    llm-timeout: 30s
    llm-retry: 1
    # 留空 = 用 Spring AI 配置的那个模型（spring.ai.ollama.chat.options.model）。
    # 刻意不在这里再写一遍模型名：模型名已经有两个入口（jobpilot.rag.chat-model 供业务层读、
    # spring.ai.ollama.chat.options.model 供注入的 ChatModel 读），第三个只会增加漂移面。
    model: ${JOBPILOT_AGENT_MODEL:}
    temperature: 0.2
    max-tokens: 1024
    # provider id：ollama（本地，默认）| openai（云端）。只允许出现在 Bean 装配处，业务代码不得读取
    # （ARCHITECTURE §5.5）。同一个环境变量还驱动 spring.ai.model.chat/embedding（见文件顶部），
    # 由 AiProviderConsistencyCheck 在启动时断言三者一致——防两个旋钮被人改歪。
    provider-path: ${JOBPILOT_AGENT_PROVIDER_PATH:ollama}
  interview:
    # 面试模拟官（BRD US-3）：阶段弧线为 基础 → 项目深挖 → 压力，故 questions-per-round 必须正好 3 个
    questions-per-round: [3, 2, 2]
    default-tier: ${JOBPILOT_INTERVIEW_DEFAULT_TIER:BIG_TECH}
    # 公司档位 → 预设难度与追问风格；用户可在创建会话时用 difficultyOverride 覆盖
    tiers:
      BIG_TECH:
        difficulty: HARD
        followup-style: DEEP
        pressure: true
      MID_TECH:
        difficulty: MEDIUM
        followup-style: STANDARD
        pressure: false
      STARTUP:
        difficulty: EASY
        followup-style: PRAGMATIC
        pressure: false
  ingest:
    # I-1c DB 队列 worker：任务行即消息，无 @Async / 无 MQ
    enabled: true
    poll-interval: 2s
    worker-threads: 2
    max-retries: 3
    retry-backoff: 30s
    max-per-tenant: 2
    stale-processing-timeout: 10m
  security:
    # 不提供默认密钥：JWT 密钥必须通过环境变量注入，避免把可伪造令牌的密钥提交进 git。
    jwt-secret: ${JOBPILOT_SECURITY_JWT_SECRET:}
    jwt-issuer: ${JOBPILOT_SECURITY_JWT_ISSUER:jobpilot}
    access-token-ttl: ${JOBPILOT_SECURITY_ACCESS_TOKEN_TTL:PT2H}
    bcrypt-strength: ${JOBPILOT_SECURITY_BCRYPT_STRENGTH:10}
    public-paths:
      - /api/v1/health
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /api/v1/auth/privacy-notice
      - /actuator/health
    # 隐私政策与数据用途说明（I-1b）：文案是非敏感内容，直接入库；改动时同步递增版本号
    privacy-notice-version: "2026-10-02"
    privacy-notice: |
      注册与使用本服务时，我们这样处理你的数据：
      1. 注册收集邮箱（作为账号唯一标识）与密码（仅以加盐哈希存储，任何人（包括我们）都无法看到明文）；
      2. 你导入的简历、JD 等材料仅用于向你本人提供检索与问答，不用于训练模型，不向其他用户提供；
      3. 你可以随时导出或删除自己的全部数据，删除后服务端副本一并清除。
  rag:
    ollama-base-url: ${JOBPILOT_RAG_OLLAMA_URL:http://localhost:11434}
    embedding-model: ${JOBPILOT_RAG_EMBEDDING_MODEL:bge-m3}
    chat-model: ${JOBPILOT_RAG_CHAT_MODEL:qwen2.5:3b}
    chroma-base-url: ${JOBPILOT_RAG_CHROMA_URL:http://localhost:8000}
    chroma-collection: ${JOBPILOT_RAG_CHROMA_COLLECTION:jobpilot_chunks}
    # 0.6.x REST 无法按名获取已有集合，重启后保持集合不变靠这个固定 UUID
    chroma-collection-id: ${JOBPILOT_RAG_CHROMA_COLLECTION_ID:}
    chunk-size: 500
    chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.45
    keyword-min-hits: 2   # 降级检索：至少命中 N 个不同关键词才算证据；待评测集校准
  rerank:
    # 重排序（可选，云端 SiliconFlow /rerank）。enabled=false → 检索直接用向量分数排序。
    # 失败**不影响**检索：静默回退到向量序，且**不置 degraded**（那个标记专指向量→关键词降级）。
    enabled: ${JOBPILOT_RERANK_ENABLED:false}
    base-url: ${JOBPILOT_RERANK_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${JOBPILOT_RERANK_API_KEY:}
    model: ${JOBPILOT_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
